<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strudel Jelly</title>
<link rel="icon" href="/icon.png">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand">
      <img class="logo-mascot" src="/mascot.png" alt="" aria-hidden="true">
      <span class="brand-name">strudel <b>jelly</b></span>
    </div>
    <div class="transport">
      <button type="button" class="btn btn-pink play-btn" id="play" data-testid="play" disabled title="Loading sounds">
        <span class="play-icon" aria-hidden="true">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"></path></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect></svg>
          <span class="spinner"></span>
        </span>
        <span id="play-label">Play</span>
      </button>
      <div class="readout">
        <span class="tempo" id="tempo" data-testid="tempo" title="Tempo, assuming 4 beats per cycle (BPM = cycles per minute x 4)"></span>
        <span class="cycle" id="cycle" data-testid="cycle" title="Cycles played since Play">cycle <b>0</b></span>
        <span class="vst-cpu" id="vst-cpu" data-testid="vst-cpu" hidden>CPU <span class="vst-cpu-bar"><i></i></span><span class="vst-cpu-val"></span></span>
      </div>
    </div>
    <div class="titlebar-right">
      <div class="segmented" role="group" aria-label="Side panel">
        <button type="button" data-pane="sketches" data-testid="pane-sketches" aria-label="Sketches" title="Sketches" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h5"></path></svg>
        </button>
        <button type="button" data-pane="sounds" data-testid="pane-sounds" aria-label="Sounds" title="Sounds" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"></path></svg>
        </button>
        <button type="button" data-pane="docs" data-testid="pane-docs" aria-label="Docs" title="Docs (F1 on a function, Ctrl+K searches everything)" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"></path></svg>
        </button>
        <button type="button" data-pane="mixer" data-testid="pane-mixer" aria-label="Mixer" title="Mixer: your VST plugins" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"></path><rect x="3.5" y="12" width="5" height="3" rx="1.2" fill="currentColor"></rect><rect x="9.5" y="7" width="5" height="3" rx="1.2" fill="currentColor"></rect><rect x="15.5" y="14" width="5" height="3" rx="1.2" fill="currentColor"></rect></svg>
        </button>
        <button type="button" data-pane="settings" data-testid="pane-settings" aria-label="Settings" title="Settings" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <div class="main-col" id="main-col">
    <section class="panel editor-panel" id="editor-panel" aria-label="Code">
      <div class="panel-head">
        <button type="button" class="sketch-name" id="sketch-name" data-testid="sketch-name" title="Open sketches (double-click to rename)">&hellip;</button>
        <span class="save-state" id="save-state" data-testid="save-state" data-state="saved" title="Autosaves after a short pause. Ctrl+S saves now."></span>
        <!-- status: the current error, sound loading, Vim mode and cursor position live in the code panel's header -->
        <span class="status-error" id="error" data-testid="status-error" role="alert" hidden></span>
        <span class="head-spacer"></span>
        <span class="status-right" data-testid="status-bar">
          <span class="status-loading" data-testid="status-loading" hidden><span class="spinner" aria-hidden="true"></span><span id="status-loading-text"></span></span>
          <span class="status-vim" id="status-vim" data-testid="status-vim" hidden></span>
          <span class="status-cursor" id="status-cursor" data-testid="status-cursor">Ln 1, Col 1</span>
        </span>
      </div>
      <div class="vst-banner" id="vst-banner" data-testid="vst-banner" role="status" hidden>
        <span class="vst-banner-text"></span>
        <button type="button" class="head-btn" data-testid="vst-banner-dismiss">Dismiss</button>
      </div>
      <div class="editor-body">
        <canvas id="test-canvas"></canvas>
        <div id="editor"></div>
      </div>
    </section>
    <div class="splitter" id="viz-splitter" data-testid="viz-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize piano roll" tabindex="0" title="Drag to resize. Double-click to reset."></div>
    <section class="panel viz" id="viz" data-testid="viz" aria-label="Piano roll" hidden>
      <div class="panel-head">
        <span class="panel-title">Piano roll</span>
        <div class="head-group" role="group" aria-label="Zoom">
          <button type="button" class="head-btn sq zoom-btn" id="zoom-in" data-testid="zoom-in" aria-label="Zoom in" title="Zoom in (Ctrl+scroll on the roll)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
          <span class="zoom-val" id="zoom-val" data-testid="zoom-val"></span>
          <button type="button" class="head-btn sq zoom-btn" id="zoom-out" data-testid="zoom-out" aria-label="Zoom out" title="Zoom out (Ctrl+scroll on the roll)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
        </div>
        <div class="head-group" role="group" aria-label="Row height">
          <button type="button" class="head-btn sq zoom-btn" id="rows-in" data-testid="rows-in" aria-label="Taller rows" title="Taller rows (Alt+scroll on the roll)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"></path></svg></button>
          <span class="zoom-val" id="rows-val" data-testid="rows-val"></span>
          <button type="button" class="head-btn sq zoom-btn" id="rows-out" data-testid="rows-out" aria-label="Shorter rows" title="Shorter rows (Alt+scroll on the roll)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button>
        </div>
        <span class="head-spacer"></span>
        <button type="button" class="head-btn btn-sky" id="viz-follow" data-testid="viz-follow" hidden title="Back to the playhead">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"></path></svg>Follow
        </button>
      </div>
      <canvas id="viz-canvas"></canvas>
    </section>
    </div>

    <aside class="panel sidebar" id="sidebar">
      <div class="pane pane-sketches" id="pane-sketches" aria-label="Sketches" hidden></div>
      <div class="pane" id="pane-sounds-wrap" aria-label="Sounds">
        <div class="panel-head"><span class="panel-title">Sounds</span></div>
        <div class="pane-body" id="pane-sounds"></div>
      </div>

      <div class="pane pane-docs" id="pane-docs" aria-label="Docs" hidden></div>
      <div class="pane pane-mixer" id="pane-mixer" aria-label="Mixer" hidden></div>

      <div class="pane pane-settings" id="pane-settings" aria-label="Settings" hidden>
      <div class="panel-head"><span class="panel-title">Settings</span></div>
      <div class="pane-body pane-scroll">

      <section class="set-group">
        <h3>Look</h3>
        <div class="set-row">
          <span class="set-label" id="theme-label">Theme</span>
          <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
            <button type="button" role="radio" data-theme-choice="system">System</button>
            <button type="button" role="radio" data-theme-choice="light">Light</button>
            <button type="button" role="radio" data-theme-choice="dark">Dark</button>
          </div>
        </div>
        <label class="set-row">
          <span class="set-label">Code size <b id="font-size-val"></b></span>
          <input type="range" id="font-size" min="12" max="30" step="1">
        </label>
      </section>

      <section class="set-group">
        <h3>Editor</h3>
        <div class="set-row">
          <span class="set-label" id="keys-label">Keys<small>In Vim, :w plays and :q stops</small></span>
          <div class="segmented" role="radiogroup" aria-labelledby="keys-label">
            <button type="button" role="radio" data-keys-choice="codemirror" data-testid="keys-normal">Normal</button>
            <button type="button" role="radio" data-keys-choice="vim" data-testid="keys-vim">Vim</button>
          </div>
        </div>
        <label class="set-row toggle-row"><span class="set-label">Wrap long lines</span><input type="checkbox" class="toggle" data-setting="isLineWrappingEnabled"></label>
        <label class="set-row toggle-row"><span class="set-label">Suggestions while typing</span><input type="checkbox" class="toggle" data-setting="isAutoCompletionEnabled"></label>
        <label class="set-row toggle-row"><span class="set-label">Light up playing notes</span><input type="checkbox" class="toggle" data-setting="isPatternHighlightingEnabled"></label>
        <label class="set-row toggle-row"><span class="set-label">Hot reload</span><input type="checkbox" class="toggle" id="hot-setting" data-testid="hot-setting"></label>
        <label class="set-row toggle-row"><span class="set-label">Piano roll</span><input type="checkbox" class="toggle" id="viz-setting" data-testid="viz-setting"></label>
        <label class="set-row toggle-row"><span class="set-label">Line numbers</span><input type="checkbox" class="toggle" data-setting="isLineNumbersDisplayed"></label>
      </section>

      <section class="set-group" id="set-audio" data-testid="set-audio">
        <h3>Audio</h3>
        <p class="set-note set-error" id="audio-down" data-testid="audio-down" hidden></p>
        <div class="set-row">
          <span class="set-label" id="out-label">Output</span>
          <select class="select" id="audio-device" data-testid="audio-device" aria-labelledby="out-label"></select>
        </div>
        <div class="set-row">
          <span class="set-label" id="drv-label">Driver</span>
          <div id="audio-driver" data-testid="audio-driver"></div>
        </div>
        <div class="set-row">
          <span class="set-label" id="buf-label">Buffer<small id="buf-delay" data-testid="buf-delay"></small></span>
          <div class="segmented" id="audio-buffer" data-testid="audio-buffer" role="radiogroup" aria-labelledby="buf-label"></div>
        </div>
      </section>

      <section class="set-group" id="set-plugins" data-testid="set-plugins">
        <h3>Plugins</h3>
        <div class="set-row">
          <span class="set-label"><span id="plug-found" data-testid="plug-found"></span><small id="plug-skipped" data-testid="plug-skipped"></small></span>
          <button type="button" class="head-btn" id="plug-rescan" data-testid="plug-rescan">Rescan</button>
        </div>
        <label class="set-row toggle-row"><span class="set-label">Plugin knobs update code<small>Only values already written in code</small></span><input type="checkbox" class="toggle" id="knobs-setting" data-testid="knobs-setting"></label>
        <div class="set-row"><span class="set-label">Plugin folders</span><button type="button" class="head-btn" id="plug-folders-edit" data-testid="plug-folders-edit">Edit</button></div>
        <div class="plug-folders" id="plug-folders" data-testid="plug-folders" hidden></div>
      </section>

      <section class="set-group">
        <h3>Offline sounds</h3>
        <p class="set-note" id="offline-label">Checking...</p>
        <div class="track" id="track" role="progressbar" aria-label="Built-in sounds saved offline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
        <div class="row">
          <button type="button" class="btn btn-butter btn-sm" id="offline">Save all sounds offline</button>
          <button type="button" class="btn btn-cream btn-sm" id="open-cache">Open cache folder</button>
        </div>
      </section>
      </div>
      </div>
    </aside>
  </main>


</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
